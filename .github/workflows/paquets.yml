# Fabrique les fichiers d'installation, sans passer par aucun magasin.
#
# Chaque execution depose ses fichiers en artefacts, telechargeables depuis la
# page de l'execution : c'est de la que partent les envois. Une etiquette `v*`
# les rassemble en plus dans une publication brouillon, qui donne un seul lien
# pour tout recuperer.
#
# Un depot ne peut pas tout produire depuis une seule machine : Windows exige
# Windows, et une archive iOS exige macOS. D'ou trois systemes d'execution.
#
# Secrets, et ce qui se passe sans eux :
#
#   TAURI_SIGNING_PRIVATE_KEY / _PASSWORD  signature des mises a jour de bureau.
#                                          Absents : les paquets se construisent,
#                                          mais l'application installee refusera
#                                          les mises a jour automatiques.
#   ANDROID_KEYSTORE / _PASSWORD / _ALIAS  signature Android. Absents : l'APK
#                                          reste installable a la main.
#   APPLE_SIGNING_IDENTITY, APPLE_ID,      signature Developer ID et
#   APPLE_PASSWORD, APPLE_TEAM_ID          notarisation macOS. Absents : le .dmg
#                                          se construit quand meme, et s'ouvre
#                                          au prix d'un detour decrit dans
#                                          docs/installer.md.
name: Paquets

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  bureau:
    name: ${{ matrix.nom }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: macOS
            os: macos-latest
            cible: macos
            args: "--target universal-apple-darwin"
          - nom: Windows
            os: windows-latest
            cible: windows
            args: ""
          - nom: Linux
            os: ubuntu-22.04
            cible: linux
            args: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cible == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri s'appuie sur la webview du systeme ; sous Linux elle se compile.
      - name: Bibliotheques systeme
        if: matrix.cible == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Construire
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Renseignes, ces quatre secrets font signer et notariser le paquet
          # macOS : il s'ouvre alors d'un double-clic, sans detour.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: ${{ matrix.args }}

      # Sur puce Apple, un binaire sans aucune signature ne demarre pas — pas
      # meme apres avoir leve la mise en quarantaine. La signature locale ne
      # certifie personne, elle rend seulement l'application executable.
      - name: Signature locale, faute de certificat
        if: matrix.cible == 'macos' && env.APPLE_SIGNING_IDENTITY == ''
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          app=$(find src-tauri/target -name "*.app" -maxdepth 6 | head -1)
          if [ -n "$app" ]; then codesign --force --sign - "$app"; fi

      - name: Rassembler
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.cible }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: NDK
        run: |
          sdkmanager "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Le projet Gradle est engendre s'il n'est pas dans le depot. L'y
      # commiter reste preferable : c'est la qu'on modifie le manifeste.
      - name: Projet Android
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npm run tauri android init -- --skip-targets-install
          fi

      - name: Clef de signature
        if: ${{ env.ANDROID_KEYSTORE != '' }}
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > src-tauri/gen/android/release.jks
          cat >> src-tauri/gen/android/keystore.properties <<PROPS
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PROPS

      - run: npm run tauri android build -- --apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  # Une archive iOS ne s'installe pas en la recevant : le systeme n'accepte que
  # ce qu'un profil autorise, et un profil suppose le programme Apple. Cette
  # execution ne demarre donc que si un identifiant d'equipe est declare — voir
  # docs/empaquetage.md, section iOS.
  ios:
    name: iOS
    runs-on: macos-latest
    if: ${{ vars.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Projet Xcode
        run: |
          if [ ! -d src-tauri/gen/apple ]; then
            npm run tauri ios init
          fi

      - name: Trousseau de signature
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          echo "$CERT" | base64 -d > cert.p12
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

      - name: Archive
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: npm run tauri ios build -- --export-method ad-hoc

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          if-no-files-found: error
          path: src-tauri/gen/apple/build/**/*.ipa

  # Une etiquette rassemble tout au meme endroit : un seul lien a envoyer.
  publication:
    name: Publication brouillon
    needs: [bureau, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paquets

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Pseudonymizer ${{ github.ref_name }}
          files: paquets/**/*
